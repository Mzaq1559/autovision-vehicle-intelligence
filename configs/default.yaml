# AutoVision default configuration.
# Copy this file (e.g. to configs/my_scene.yaml) and adjust it per camera/scene.
# Every value here can also be changed live from the Streamlit sidebar for
# quick experimentation; edit this file for durable, scene-specific defaults.

model:
  weights: yolov8n.pt # Ultralytics model name or path to local weights
  device: auto # auto | cpu | cuda
  confidence: 0.35
  iou_threshold: 0.45
  classes:
    - car
    - motorcycle
    - bus
    - truck

tracker:
  type: bytetrack # bytetrack | botsort
  track_buffer: 30
  match_threshold: 0.8
  trajectory_length: 40 # number of recent points kept per vehicle

calibration:
  # Real-world distance, in meters, between the two reference points below.
  # Measure this on-site (e.g. lane-marking spacing, a fixed known distance).
  reference_distance_m: 20.0
  # Pixel coordinates [x, y] of the two calibration points in your video.
  reference_points_px:
    - [100.0, 600.0]
    - [100.0, 200.0]
  fps: null # null => read FPS from the video/camera

measurement_zone:
  line_y_fraction: 0.6 # 0-1, fraction of frame height
  line_thickness_px: 4

speed:
  limit_kmh: 60.0
  smoothing_window: 5
  min_samples_for_estimate: 3

direction:
  mode: screen_relative # screen_relative | geographic
  min_displacement_px: 6.0
  geographic_labels:
    up: Northbound
    down: Southbound
    left: Westbound
    right: Eastbound

counting:
  line_y_fraction: 0.6
  line_thickness_px: 4

video:
  default_fps: 30.0
  # max_width: display/output resolution cap (preserves aspect ratio).
  # Lowered from 1280 to 960 as a better CPU-friendly default.
  max_width: 960
  processing_mode: accuracy # accuracy | demo
  # processing_width: resolution used for YOLO inference.
  # Set lower than max_width for faster inference (e.g. 640).
  # 0 = same as max_width (no separate inference resize).
  # Detection boxes are automatically scaled back to display resolution.
  processing_width: 0
  demo_processing_width: 640
  inference_interval: 1 # Demo mode: infer every N source frames.
  # ui_update_interval: update Streamlit metrics/table every N processed frames.
  # The annotated video frame still updates on every processed frame.
  # Higher values reduce UI overhead on slow CPUs. Default: 5.
  ui_update_interval: 5
  # frame_skip: number of source frames to drop between each processed frame.
  #   0 = process every frame (default, safest for tracking)
  #   1 = process every 2nd frame  (first recommended CPU optimisation)
  #   2 = process every 3rd frame
  # Keep this conservative; aggressive skipping can cause ByteTrack to lose IDs.
  # The original frame_index is always preserved for correct video-time calculation.
  frame_skip: 0

log_level: INFO
